name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded pull-request runs only; push runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run forge-qsparx verify --runs 3 --seed 577
      - run: make reviewer-demo benchmark-smoke

  windows:
    name: Windows CI
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q
      - run: uv run forge-qsparx verify --runs 3 --seed 577
      - run: >-
          uv run python -c "from datetime import UTC, datetime; from pathlib import Path;
          from forge_qsparx.reviewer import build_reviewer_site;
          build_reviewer_site(Path('site'), seed=577,
          generated_at=datetime(2026, 7, 21, tzinfo=UTC))"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv pip check
      - run: uv run pip-audit

  container-audit:
    name: Container audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_IMAGE: forge-qbit-qsparx:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and load local audit image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
      - name: Validate time-bounded vulnerability waivers
        run: python3 scripts/check_container_waivers.py
      - name: Smoke-test the local audit image
        run: bash scripts/smoke_container.sh "${LOCAL_IMAGE}"
      - name: Block high and critical container vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ env.LOCAL_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table
          config: .grype.yaml

  public-boundary:
    name: Public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
      - run: uv run python scripts/check_public_boundary.py

  release-manifest:
    name: Release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Verify action pins belong to declared repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_workflow_action_pins.py
      - run: make reviewer-demo
      - name: Verify content-addressed reviewer manifest
        run: >-
          uv run python -c "import json; from pathlib import Path;
          from forge_qsparx.canonical import canonical_digest;
          bundle=json.loads(Path('site/evidence/bundle.json').read_text());
          claimed=bundle.pop('bundle_digest');
          assert canonical_digest(bundle)==claimed;
          assert bundle['manifest']['root_digest'].startswith('sha256:');
          assert all(c['validator_status']=='not_started' for c in bundle['claims'])"
