name: Signed Release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, scan, attest, and release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: make verify benchmark-smoke audit
      - name: Build release files
        run: |
          mkdir -p release
          uv build --out-dir release
          uv run forge-qsparx benchmark --suite smoke --repetitions 3 --output release/benchmark-smoke.json
      - uses: docker/login-action@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
      - name: Block high and critical container vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: release/container-vulnerabilities.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: release/forge-qbit-qsparx.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: cyclonedx-json
          output-file: release/forge-qbit-qsparx.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build reviewer bundle with immutable release identity
        env:
          FORGE_QSPARX_RELEASE_TAG: ${{ github.ref_name }}
          FORGE_QSPARX_SOURCE_COMMIT: ${{ github.sha }}
          FORGE_QSPARX_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          make reviewer-demo
          cp site/evidence/bundle.json release/reviewer-evidence-bundle.json
          uv run python -c "import json; from pathlib import Path; bundle=json.loads(Path('site/evidence/bundle.json').read_text()); Path('release/evidence-manifest.json').write_text(json.dumps(bundle['manifest'], indent=2, sort_keys=True) + '\n')"
          tar -C site -czf release/reviewer-bundle.tar.gz .
      - name: Create release checksums
        run: (cd release && sha256sum * > SHA256SUMS)
      - name: Attest release files
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest OCI image
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish immutable release files
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true

  publish-pages:
    name: Publish release reviewer site
    needs: release
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_commit: ${{ github.sha }}
      image_digest: ${{ needs.release.outputs.image_digest }}
