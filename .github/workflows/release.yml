name: Signed Release

on:
  push:
    tags: ["v0.1.2"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 577industries/forge-qbit-qsparx

jobs:
  release:
    name: Build, scan, attest, and release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    env:
      LOCAL_IMAGE: forge-qbit-qsparx:release-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: make verify benchmark-smoke audit
      - name: Build release files
        run: |
          mkdir -p release
          uv build --out-dir release
          uv run forge-qsparx benchmark --suite smoke --repetitions 3 --output release/benchmark-smoke.json
      - name: Build and load local release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
      - name: Validate time-bounded vulnerability waivers
        run: python3 scripts/check_container_waivers.py
      - name: Smoke-test the local release image
        run: bash scripts/smoke_container.sh "${LOCAL_IMAGE}"
      - name: Block high and critical container vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.LOCAL_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: release/container-vulnerabilities.json
          config: .grype.yaml
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: release/forge-qbit-qsparx.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx-json
          output-file: release/forge-qbit-qsparx.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Authenticate to GHCR after local security gates
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push immutable release images
        env:
          VERSION_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          SHA_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          docker tag "${LOCAL_IMAGE}" "${VERSION_IMAGE}"
          docker tag "${LOCAL_IMAGE}" "${SHA_IMAGE}"
          docker push "${VERSION_IMAGE}"
          docker push "${SHA_IMAGE}"
      - name: Resolve and compare pushed image digests
        id: image
        env:
          VERSION_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          SHA_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          VERSION_DIGEST="$(docker buildx imagetools inspect "${VERSION_IMAGE}" --format '{{.Manifest.Digest}}')"
          SHA_DIGEST="$(docker buildx imagetools inspect "${SHA_IMAGE}" --format '{{.Manifest.Digest}}')"
          test "${VERSION_DIGEST#sha256:}" != "${VERSION_DIGEST}"
          test "${#VERSION_DIGEST}" -eq 71
          printf '%s\n' "${VERSION_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "${VERSION_DIGEST}" = "${SHA_DIGEST}"
          echo "digest=${VERSION_DIGEST}" >> "${GITHUB_OUTPUT}"
      - name: Verify anonymous immutable pull and health
        env:
          IMMUTABLE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        run: |
          ANONYMOUS_DOCKER_CONFIG="$(mktemp -d)"
          test ! -e "${ANONYMOUS_DOCKER_CONFIG}/config.json"
          export DOCKER_CONFIG="${ANONYMOUS_DOCKER_CONFIG}"
          unset DOCKER_AUTH_CONFIG
          docker pull "${IMMUTABLE_IMAGE}"
          bash scripts/smoke_container.sh "${IMMUTABLE_IMAGE}"
      - name: Build reviewer bundle with immutable release identity
        env:
          FORGE_QSPARX_RELEASE_TAG: ${{ github.ref_name }}
          FORGE_QSPARX_SOURCE_COMMIT: ${{ github.sha }}
          FORGE_QSPARX_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          make reviewer-demo
          cp site/evidence/bundle.json release/reviewer-evidence-bundle.json
          uv run python -c "import json; from pathlib import Path; bundle=json.loads(Path('site/evidence/bundle.json').read_text()); Path('release/evidence-manifest.json').write_text(json.dumps(bundle['manifest'], indent=2, sort_keys=True) + '\n')"
          tar -C site -czf release/reviewer-bundle.tar.gz .
      - name: Create release checksums
        run: |
          cd release
          sha256sum \
            forge_qbit_qsparx-0.1.2-py3-none-any.whl \
            forge_qbit_qsparx-0.1.2.tar.gz \
            benchmark-smoke.json \
            container-vulnerabilities.json \
            forge-qbit-qsparx.spdx.json \
            forge-qbit-qsparx.cdx.json \
            reviewer-evidence-bundle.json \
            evidence-manifest.json \
            reviewer-bundle.tar.gz \
            > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest OCI image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish immutable release files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: docs/releases/v0.1.2.md
          fail_on_unmatched_files: true
          files: |
            release/forge_qbit_qsparx-0.1.2-py3-none-any.whl
            release/forge_qbit_qsparx-0.1.2.tar.gz
            release/container-vulnerabilities.json
            release/forge-qbit-qsparx.spdx.json
            release/forge-qbit-qsparx.cdx.json
            release/benchmark-smoke.json
            release/reviewer-evidence-bundle.json
            release/evidence-manifest.json
            release/reviewer-bundle.tar.gz
            release/SHA256SUMS

  publish-pages:
    name: Publish release reviewer site
    needs: release
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ github.ref_name }}
      source_commit: ${{ github.sha }}
      image_digest: ${{ needs.release.outputs.image_digest }}
